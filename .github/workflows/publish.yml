name: Publish Puma to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify package metadata
        run: |
          npm pkg get name
          npm pkg get version
          npm pkg get bin

      - name: Verify Puma CLI
        run: |
          test -f puma.js
          echo "First line of puma.js:"
          head -n 1 puma.js
          echo "File permissions:"
          ls -l puma.js

      - name: Install dependencies
        run: npm install

      - name: Verify node_modules
        run: |
          test -d node_modules
          test -d node_modules/readline-sync
          test -d node_modules/ws

      - name: Test Puma
        run: |
          printf '%s\n' 'show("Hello World!");' > test.pulsar
          node puma.js test.pulsar

      - name: Check package
        run: npm pack --dry-run

      - name: Publish Puma
        run: npm publish --access public
