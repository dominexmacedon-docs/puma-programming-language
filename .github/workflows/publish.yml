name: Publish Puma to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Verify node_modules
        run: |
          test -d node_modules
          test -d node_modules/readline-sync
          test -d node_modules/ws

      - name: Test Puma
        run: node puma.js test.pulsar

      - name: Check package
        run: npm pack --dry-run

      - name: Publish Puma
        run: npm publish --access public
