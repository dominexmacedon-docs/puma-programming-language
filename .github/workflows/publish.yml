name: Build Puma Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Puma
        uses: actions/checkout@v6

      - name: Setup Node.js for building
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Puma dependencies
        run: npm install --omit=dev

      - name: Get Puma version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download portable Node.js
        shell: pwsh
        run: |
          $nodeVersion = "v24.19.0"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile node.zip

          Expand-Archive `
            -Path node.zip `
            -DestinationPath node-runtime `
            -Force

          New-Item `
            -ItemType Directory `
            -Force `
            -Path release/Puma

          Copy-Item `
            "node-runtime/node-$nodeVersion-win-x64/node.exe" `
            "release/Puma/node.exe"

      - name: Prepare Puma files
        shell: pwsh
        run: |
          Copy-Item puma.js release/Puma/
          Copy-Item lexer.js release/Puma/
          Copy-Item parser.js release/Puma/
          Copy-Item evaluator.js release/Puma/
          Copy-Item package.json release/Puma/
          Copy-Item README.md release/Puma/

          Copy-Item `
            node_modules `
            release/Puma/node_modules `
            -Recurse

      - name: Create Puma launcher
        shell: pwsh
        run: |
          @'
          @echo off
          "%~dp0node.exe" "%~dp0puma.js" %*
          '@ | Set-Content `
            -Path release/Puma/puma.cmd `
            -Encoding ASCII

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          @"
          #define PumaVersion "${{ steps.version.outputs.version }}"

          [Setup]
          AppId={{B8B6B6D0-6E9D-4D90-9B72-PUMA00000001}
          AppName=Puma
          AppVersion={#PumaVersion}
          AppPublisher=Dominex Macedon
          AppPublisherURL=https://github.com/dominexmacedon-docs/puma-programming-language
          DefaultDirName={autopf}\Puma
          DefaultGroupName=Puma
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=PumaSetup-v{#PumaVersion}
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          Uninstallable=yes
          ChangesEnvironment=yes

          [Files]
          Source: "release\Puma\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{group}\Puma"; Filename: "{app}\puma.cmd"
          Name: "{group}\Uninstall Puma"; Filename: "{uninstallexe}"

          [Registry]
          Root: HKLM
          Subkey: "SYSTEM\CurrentControlSet\Control\Session Manager\Environment"
          ValueType: expandsz
          ValueName: "Path"
          ValueData: "{olddata};{app}"
          Flags: preservestringtype

          [Run]
          Filename: "{app}\puma.cmd"
          Parameters: "-v"
          WorkingDir: "{app}"
          Flags: postinstall skipifsilent
          "@ | Set-Content -Path PumaInstaller.iss -Encoding UTF8

      - name: Build Puma installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          & $iscc "PumaInstaller.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "installer\PumaSetup-v${{ steps.version.outputs.version }}.exe"

          if (-not (Test-Path $installer)) {
            throw "Puma installer was not created."
          }

          Write-Host "Created:"
          Get-Item $installer | Format-List FullName,Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Puma v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            installer/PumaSetup-v${{ steps.version.outputs.version }}.exe
