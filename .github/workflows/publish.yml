name: Build Puma Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Puma
        uses: actions/checkout@v6

      - name: Setup Node.js for building
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Puma dependencies
        run: npm install --omit=dev

      - name: Get Puma version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download portable Node.js
        shell: pwsh
        run: |
          $nodeVersion = "v24.19.0"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile node.zip

          Expand-Archive `
            -Path node.zip `
            -DestinationPath node-runtime `
            -Force

          New-Item -ItemType Directory -Force -Path release/Puma

          Copy-Item `
            "node-runtime/node-$nodeVersion-win-x64/node.exe" `
            "release/Puma/node.exe"

      - name: Prepare Puma release
        shell: pwsh
        run: |
          Copy-Item puma.js release/Puma/
          Copy-Item lexer.js release/Puma/
          Copy-Item parser.js release/Puma/
          Copy-Item evaluator.js release/Puma/
          Copy-Item package.json release/Puma/
          Copy-Item README.md release/Puma/

          Copy-Item `
            node_modules `
            release/Puma/node_modules `
            -Recurse

      - name: Create Puma launcher
        shell: pwsh
        run: |
          @'
          @echo off
          "%~dp0node.exe" "%~dp0puma.js" %*
          '@ | Set-Content -Path release/Puma/puma.cmd -Encoding ASCII

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/Puma `
            -DestinationPath "Puma-v${{ steps.version.outputs.version }}-windows-x64.zip" `
            -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Puma v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            Puma-v${{ steps.version.outputs.version }}-windows-x64.zip
